  openDrawer(`
    <div class="mhd" style="padding:22px 28px;border-bottom:1px solid var(--stroke-weak)">
      <h2 style="font-size:18px;font-weight:700">Members in ${o.name}</h2>
      <div class="mact"><span id="vmcls" style="cursor:pointer">✕</span></div>
    </div>
    <div style="flex:1;overflow-y:auto">
      <table class="flat" style="width:100%">
        <thead><tr>
          <th style="padding:16px 28px 12px">Member</th>
          <th style="padding:16px 28px 12px">Email ID</th>
          <th style="padding:16px 14px 12px;text-align:right">${ICON.cols}</th>
        </tr></thead>
        <tbody>${members.map(m=>`<tr style="cursor:default">
          <td style="padding:0 28px"><div class="oname">${ICON.user}<span class="nn">${m.name}</span></div></td>
          <td class="muted" style="padding:0 28px">${m.email}</td>
          <td></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`);
  document.getElementById('vmcls').addEventListener('click', closeDrawer);
}

/* ===========================================================================
   Manage Protection wizard
   =========================================================================== */
const MP = {on:false};
function openProtect(ids){
  const objs = ids.map(byId).filter(Boolean);
  Object.assign(MP, {on:true, ids, objs, step:1, choice:objs[0]&&objs[0].sla||null, mode:'sla', q:''});
  mpRender();
}
function mpTarget(){
  return MP.objs.length===1 ? MP.objs[0].name : `${num(MP.objs.length)} selected objects`;
}
function mpRender(){
  if(MP.step===1){
    const q=MP.q.trim().toLowerCase();
    const rows=WS_SLA.filter(s=>!q||s.name.toLowerCase().includes(q));
    const body = `<div class="mbody"><h3>Assign an SLA Domain</h3>
      <div class="lead" style="margin-bottom:20px">Assign an SLA Domain to <b>${mpTarget()}</b>.</div>
      <div class="wtop" style="align-items:center;margin-bottom:18px">
        <div class="objtype" style="flex:1">Object Type: <b>Google Workspace</b> <span style="font-size:10px;color:var(--text-weak)">▾</span></div>
        <button class="plusbtn" data-mp="new-sla" title="Create SLA Domain">＋</button>
        <div class="search sm"><span class="si">${ICON.searchi}</span>
          <input placeholder="Search by SLA Domain" value="${MP.q}" data-mp="q"></div></div>
      <table class="flat"><thead><tr><th class="cbcell"></th><th>SLA Domain</th><th>Deployment Model</th>
        <th>Creator Org</th><th>Base Frequency</th><th>Maximum Rete…</th></tr></thead>
        <tbody>${rows.map(s=>`<tr class="${MP.mode==='sla'&&MP.choice===s.name?'rowsel':''}" data-mp="pick" data-v="${s.name}">
          <td class="cbcell"><input type="radio" class="rd" name="mpsla" ${MP.mode==='sla'&&MP.choice===s.name?'checked':''}></td>
          <td><div class="oname">${ICON.shield}<span class="nn">${s.name}</span></div></td>
          <td>${s.model}</td><td title="${s.org}" style="max-width:150px">${s.org}</td><td>${s.freq}</td><td>${s.ret}</td></tr>`).join('')}
        </tbody></table>
      ${rows.length?'':'<div class="empty">No SLA Domains match the search.</div>'}
      <div class="slabottom">
        <div class="optrow ${MP.mode==='none'?'on':''}" data-mp="mode" data-v="none">
          <input type="radio" class="rd" name="mpsla" ${MP.mode==='none'?'checked':''}>${ICON.noprot}
          <div><span class="ot">Don't Protect.</span><span class="od">Selected object won't be protected until you directly change their SLA Domain assignment.</span></div></div>
        <div class="optrow ${MP.mode==='clear'?'on':''}" data-mp="mode" data-v="clear">
          <input type="radio" class="rd" name="mpsla" ${MP.mode==='clear'?'checked':''}>${ICON.clearsla}
          <div><span class="ot">Clear current SLA Domain.</span><span class="od">Selected object will inherit the SLA Domain of the parent object, if applicable.</span></div></div>
      </div></div>`;
    const ready = MP.mode!=='sla' || !!MP.choice;
    const footer = `<div class="mfooter"><div class="mfl"></div><div class="mfr">
      <button class="btn primary" data-mp="next" ${ready?'':'disabled'}>Next</button></div></div>`;
    return mpPaint(mhd('Manage Protection',true)+stepper(1,2)+body+footer);
  }
  const s = MP.mode==='sla' ? slaOf(MP.choice) : null;
  const headline = MP.mode==='sla' ? MP.choice : MP.mode==='none' ? "Don't Protect" : 'Clear current SLA Domain';
  const body = `<div class="mbody confirm"><h3>Confirmation</h3>
    <div class="cline"><b>SLA Domain:</b> ${headline}</div>
    <div class="cline">${MP.mode==='sla'?'The SLA Domain will be applied to':MP.mode==='none'
      ?'Protection will be removed from':'The SLA Domain assignment will be cleared for'} <b>${mpTarget()}</b></div>
    ${MP.mode==='sla'?`<div class="crule"></div><h4>Frequency and Retention</h4>
      <div class="cgrid"><div><div class="ck">Take every</div><div class="cv">${s.freq}</div></div>
        <div><div class="ck">Retain for</div><div class="cv">${s.retLabel}</div></div></div>`
      :`<div class="crule"></div><div class="lead">${MP.mode==='none'
        ? 'Existing snapshots are retained and remain available for restore. No new snapshots will be taken.'
        : 'The object inherits the SLA Domain of its parent, if one is assigned.'}</div>`}</div>`;
  const footer = `<div class="mfooter"><div class="mfl"></div><div class="mfr">
    <button class="btn" data-mp="back">Back</button><button class="btn primary" data-mp="assign">Assign</button></div></div>`;
  mpPaint(mhd('Manage Protection',false)+stepper(2,2)+body+footer);
}
function mpPaint(html){
  openModal(html);
  md.querySelectorAll('[data-mp]').forEach(el=>{
    const a=el.dataset.mp;
    if(a==='q'){ el.addEventListener('input',()=>{ MP.q=el.value; mpRender(); }); return; }
    el.addEventListener('click',()=>{
      switch(a){
        case 'pick': MP.mode='sla'; MP.choice=el.dataset.v; break;
        case 'mode': MP.mode=el.dataset.v; break;
        case 'next': MP.step=2; break;
        case 'back': MP.step=1; break;
        case 'new-sla': toast('Create SLA Domain','Opening the SLA Domain creation wizard for object type Google Workspace.','info'); return;
        case 'assign': {
          const parentSla = APPS[S.app].sla;
          MP.objs.forEach(o=>{
            if(MP.mode==='sla'){ o.sla=MP.choice; o.assignment='Direct'; o.protected=true; if(!o.snaps) o.snaps=1; }
            else if(MP.mode==='none'){ o.sla=null; o.assignment='Direct'; o.protected=false; }
            else { o.sla=parentSla; o.assignment='Derived'; o.protected=true; if(!o.snaps) o.snaps=1; }
          });
          const n=MP.objs.length;
          closeModal(); S.sel=new Set();
          toast('Protection updated', MP.mode==='sla'
            ? `${num(n)} object${n>1?'s':''} assigned to SLA Domain ${MP.choice}.`
            : MP.mode==='none' ? `${num(n)} object${n>1?'s':''} set to Don't Protect. Existing snapshots are retained.`
            : `SLA Domain cleared on ${num(n)} object${n>1?'s':''}. They now inherit ${parentSla}.`);
          render(); return;
        }
      }
      mpRender();
    });
  });
}

/* ===========================================================================
   Delegated events (page level)
   =========================================================================== */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ closeMenu(); return; }
  const act=el.dataset.act, keepMenu=['menu-kebab','menu-protect-org','row-menu'].includes(act);
  switch(act){
    case 'apps': toast('Apps','Returning to the Apps inventory for all SaaS applications.','info'); break;
    case 'org': go('org'); break;
    case 'open-app': go('app',{app:el.dataset.app,tab:'restore'}); break;
    case 'tab': go('app',{app:S.app,tab:el.dataset.tab}); break;
    case 'sub': go('app',{app:S.app,tab:'protect',sub:el.dataset.sub}); break;
    case 'restore': el.dataset.kind==='group' ? openGroupRestore() : openRestore(el.dataset.kind); break;
    case 'add-group': openAddGroup(); break;
    case 'view-members': openViewMembers(byId(el.dataset.id)); break;
    case 'mp-settings': openModal(`${mhd('Manage Protection',false)}
      <div class="mbody"><h3 style="font-size:21px">Manage Protection</h3>
        <div class="lead">Assign or update SLA Domains for all groups in <b>Workspace Settings</b>.
          Changes apply to all ${listFor('settings','group').filter(o=>o.protected).length} imported groups.</div>
        <div class="field" style="margin-top:24px"><label>SLA Domain</label>
          <select id="mpsdomset">${WS_SLA.map(s=>`<option value="${s.name}" ${s.name===APPS.settings.sla?'selected':''}>${s.name} — ${s.freq} / ${s.retLabel}</option>`).join('')}</select>
          <div class="hint">All groups without a direct assignment will inherit this SLA Domain.</div></div></div>
      <div class="mfooter"><div class="mfl"></div><div class="mfr">
        <button class="btn" data-act="close-modal">Cancel</button>
        <button class="btn primary" id="mpsapply">Apply</button></div></div>`, true);
      document.getElementById('mpsapply').addEventListener('click',()=>{
        const sla=document.getElementById('mpsdomset').value;
        listFor('settings','group').filter(o=>o.protected).forEach(o=>{o.sla=sla;});
        closeModal(); toast('Protection updated',`SLA Domain updated to ${sla} for all imported groups.`); render();
      }); break;

    case 'sort': { const c=el.dataset.col; S.sort={col:c,dir:S.sort.col===c?-S.sort.dir:1}; render(); break; }
    case 'sel': { e.stopPropagation(); const id=el.dataset.id; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break; }
    case 'row': {
      if(e.target.closest('[data-act="sel"]')||e.target.closest('[data-act="row-menu"]')) return;
      const id=el.dataset.id; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break;
    }
    case 'sel-all': {
      e.stopPropagation();
      const rows=filterRows(listFor(S.app,S.sub)); const all=rows.every(o=>S.sel.has(o.id));
      rows.forEach(o=> all?S.sel.delete(o.id):S.sel.add(o.id)); render(); break;
    }
    case 'clear-sel': S.sel=new Set(); render(); break;
    case 'slaf': { const v=el.dataset.v; S.slaFilter.has(v)?S.slaFilter.delete(v):S.slaFilter.add(v); render(); break; }
    case 'clear-slaf': S.slaFilter=new Set(); render(); break;
    case 'fr-toggle': el.closest('.frgroup').classList.toggle('collapsed'); break;

    case 'mp-open': if(S.sel.size) openProtect([...S.sel]); break;
    case 'row-menu': {
      const o=byId(el.dataset.id);
      openMenu(el, `<div class="mh">${o.name}</div>
        <div class="mi" data-act="mp-one" data-id="${o.id}">Manage Protection</div>
        <div class="mi" data-act="snap-one" data-id="${o.id}">Take On-Demand Snapshot</div>
        <div class="sepline"></div>
        <div class="mi" data-act="toast" data-title="Object ID copied" data-msg="${o.natId}">Copy ${KIND[o.kind]} ID</div>`);
      break;
    }
    case 'mp-one': closeMenu(); openProtect([el.dataset.id]); break;
    case 'snap-one': { closeMenu(); const o=byId(el.dataset.id);
      toast('Snapshot started',`On-demand backup queued for ${o.name}.`,'info'); break; }

    case 'menu-kebab':
      openMenu(el, `<div class="mi" data-act="toast" data-title="Edit organization" data-msg="Opening organization settings for ${ORG}.">Edit Organization</div>
        <div class="mi" data-act="toast" data-title="Refresh" data-msg="Refreshing the Google Workspace hierarchy for ${DOMAIN}.">Refresh Hierarchy</div>
        <div class="mi" data-act="toast" data-title="Storage regions" data-msg="Google Workspace backups are stored in GCP region ${REGION}.">Storage Regions</div>
        <div class="sepline"></div><div class="mi dis">Remove Organization</div>`);
      break;
    case 'menu-protect-org':
      openMenu(el, `<div class="mh">All Workspace apps</div>
        ${Object.keys(APPS).map(k=>FLOWS[k].protect
          ? `<div class="mi" data-act="goto-protect" data-app="${k}">${APPS[k].name.split(',')[0]}</div>`
          : `<div class="mi" data-act="toast" data-title="Manage Protection"
               data-msg="SLA Domain assignment for ${APPS[k].name} is not part of this prototype round.">${APPS[k].name.split(',')[0]}</div>`
        ).join('')}`);
      break;
    case 'goto-protect': closeMenu(); go('app',{app:el.dataset.app,tab:'protect'}); break;
    case 'snap-org': openModal(`${mhd('Take On-Demand Snapshot',false)}
      <div class="mbody"><h3 style="font-size:21px">Snapshot all Workspace apps</h3>
        <div class="lead">An on-demand snapshot of every protected object in <b>${ORG}</b> will be taken immediately, using the
          retention of each object's SLA Domain.</div>
        <div class="optrow on" style="cursor:default"><input type="radio" class="rd" checked disabled>
          <div><div class="ot">${num(Object.keys(APPS).reduce((s,k)=>s+APPS[k].cardRows.flatMap(([kk])=>cardList(k,kk)).filter(o=>o.protected).length,0))} protected objects</div>
          <div class="od">Google Drive, Gmail Calendar and Contacts, and Workspace Settings.</div></div></div></div>
      <div class="mfooter"><div class="mfl">Storage: GCP region ${REGION}</div><div class="mfr">
        <button class="btn" data-act="close-modal">Cancel</button>
        <button class="btn primary" data-act="snap-go">Take Snapshot</button></div></div>`, true);
      break;
    case 'snap-go': closeModal(); toast('Snapshot started','On-demand backup queued for all protected Google Workspace objects.','info'); break;
    case 'close-modal': closeModal(); break;
    case 'toast': closeMenu(); toast(el.dataset.title, el.dataset.msg, 'info'); break;
  }
  if(!el.closest('#menu') && !keepMenu) closeMenu();
});

document.addEventListener('input', e=>{
  const el=e.target.closest('[data-act="q"]'); if(!el) return;
  S.q=el.value;
  const host=document.querySelector('.mpgrid > div:last-child');
  if(host){ host.innerHTML=protectTable(filterRows(listFor(S.app,S.sub))); }
});
document.addEventListener('change', e=>{
  const el=e.target.closest('[data-act="range"]'); if(!el) return;
  S.range=el.value; drawChart();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  closeMenu();
  if(drawerOpen()) closeDrawer();
  else if(modalPanelOpen()) closeModalPanel();
  else closeModal();
});
let rsz;
window.addEventListener('resize', ()=>{
  closeMenu();
  clearTimeout(rsz);
  rsz = setTimeout(()=>{ if(S.view==='org') drawChart(); }, 120);
});

function info(text){ return `<span class="i">i<span class="tip">${text}</span></span>`; }

applyHash();
</script>
</body>
