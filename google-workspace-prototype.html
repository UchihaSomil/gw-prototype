<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Workspace — SaaS App Protection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   Aura design-system tokens (@rubrik/aura-ui — Tokens.colors.* / shadow.* /
   borderRadius.*), dark theme. Shared with the IR-health prototype.
   =========================================================================== */
:root{
  --font:'Open Sans',sans-serif;
  --surface-primary:#093565; --surface-secondary:#0a2e57; --surface-tertiary:#0c2448;
  --card-grad:linear-gradient(180deg, rgba(13,52,97,.92), rgba(10,38,78,.92));
  --card-hd:rgba(255,255,255,.045);
  --stroke:rgba(160,199,255,.24); --stroke-mod:rgba(160,199,255,.16); --stroke-weak:rgba(160,199,255,.08);
  --border-mod:rgba(255,255,255,.24);
  --text:#fff; --text-mod:rgba(255,255,255,.80); --text-weak:#c6cbcb; --text-dis:rgba(255,255,255,.56);
  --accent:#4dd2d2; --accent-solid:#007d93; --accent-hover:#0797a7;
  --success:#21ddaa; --success-bd:rgba(33,221,170,.56); --success-bg:rgba(33,221,170,.16);
  --warning:#ffb721; --warning-bd:rgba(255,183,33,.56); --warning-bg:rgba(255,183,33,.16);
  --error:#ff5664; --error-bd:rgba(255,86,100,.56); --error-bg:rgba(255,86,100,.16);
  --info:#2fcaff; --neutral:#c6cbcb; --neutral-bg:rgba(198,203,203,.14);
  --r-btn:4px; --r-chip:10px; --r-card:12px; --r-lg:16px; --r-tip:10px;
  --e2:1px 1px 4px rgba(0,0,0,.18), 3px 3px 8px rgba(0,0,0,.12);
  --e4:3px 4px 6px rgba(0,0,0,.18), 8px 8px 20px rgba(0,0,0,.22);
  --e6:3px 4px 8px rgba(0,0,0,.28), 14px 18px 34px rgba(0,0,0,.34);
  --row-hover:rgba(47,202,255,.07); --table-bd:rgba(160,199,255,.20);
  --modal-grad:linear-gradient(180deg,#0d3563,#0a2c56);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 0% 0%, rgba(4,25,60,1), rgba(8,29,63,0) 55%),
    radial-gradient(circle at 92% 12%, rgba(40,23,144,.55), rgba(40,23,144,0) 45%),
    radial-gradient(circle at 45% 60%, rgba(0,79,173,.85), rgba(0,79,173,0) 55%),
    radial-gradient(circle at 100% 100%, rgba(0,134,168,.55), rgba(0,134,168,0) 50%),
    radial-gradient(circle at 25% 100%, rgba(2,88,144,.9), rgba(2,88,144,0) 55%), #061a34;
  background-attachment:fixed}
a{color:var(--info);text-decoration:none} a:hover{color:#69e0ff}
.muted{color:var(--text-weak)}
.hidden{display:none!important}

/* ---------- global nav ---------- */
.nav{display:flex;align-items:center;padding:0 26px;height:60px;border-bottom:1px solid var(--stroke);
  background:rgba(6,16,30,.55);backdrop-filter:blur(10px);position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;white-space:nowrap}
.logo svg{width:30px;height:30px;flex-shrink:0}
.navitems{display:flex;gap:26px;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--text-mod);height:100%;align-items:center;
  margin:0 auto;padding-left:60px}
.navitems span{cursor:pointer;height:100%;display:flex;align-items:center}
.navitems span:hover{color:var(--text)}
.navitems .active{color:var(--text);box-shadow:inset 0 -3px 0 var(--accent)}
.navright{display:flex;align-items:center;gap:18px;color:var(--text-mod)}
.aipill{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:20px;border:1px solid var(--accent);
  color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.06em;cursor:pointer;background:rgba(77,210,210,.06)}
.aipill:hover{background:rgba(77,210,210,.14)}
.nicon{position:relative;cursor:pointer;display:flex;align-items:center;color:var(--text-mod)}
.nicon:hover{color:var(--text)}
.nicon .dot{position:absolute;top:-1px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--info);border:1.5px solid #0b1c31}
.orgpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border-mod);display:flex;align-items:center;justify-content:center;
  background:rgba(47,202,255,.10);cursor:pointer}

/* ---------- page frame ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 26px}
.crumb{color:var(--text-weak);font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.crumb a{color:var(--info);cursor:pointer}
.crumb .sep{color:var(--text-dis)}
.pagehd{display:flex;align-items:center;gap:15px}
.pagehd .pgico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pagehd h1{font-size:29px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.pagehd h1 .thin{font-weight:400;color:var(--text-mod);margin:0 4px}
.pgactions{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdrule{border-bottom:1px solid var(--stroke-weak);margin:18px 0 24px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px;border-radius:var(--r-btn);
  font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  border:1px solid var(--stroke);background:rgba(47,202,255,.06);color:var(--text);white-space:nowrap}
.btn:hover{background:rgba(47,202,255,.12);border-color:var(--border-mod)}
.btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;box-shadow:var(--e2)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{height:32px;padding:0 14px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:rgba(47,202,255,.06);border-color:var(--stroke)}
.btn .cv{font-size:9px;opacity:.8}
.iconbtn{width:38px;height:38px;border-radius:var(--r-btn);border:1px solid var(--stroke);background:rgba(47,202,255,.06);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:1px}
.iconbtn:hover{background:rgba(47,202,255,.12)}
.linkbtn{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:none;
  border:none;font-family:var(--font);display:inline-flex;align-items:center;gap:6px}
.linkbtn:hover{color:#7ce7e7}
.inlinelink{color:var(--accent);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.inlinelink:hover{color:#7ce7e7}

/* ---------- cards ---------- */
.card{background:var(--card-grad);border:1px solid var(--stroke);border-radius:var(--r-card);box-shadow:var(--e2)}
.card.pad{padding:22px}
.card h3{font-size:17px;font-weight:700}

/* ---------- org page: one 3-column grid ----------
   Row 1: the three app cards. Row 2: Backup Jobs spanning the first two columns,
   Status in the third so it is exactly as wide as the app card above it. */
.orggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.orggrid .jobs{grid-column:span 2;min-width:0}
.appcard{cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative}
.appcard:hover{border-color:rgba(77,210,210,.55);transform:translateY(-2px);box-shadow:var(--e4)}
/* min-height fits a two-line app name (Gmail, Calendar and Contacts) so all
   three cards keep their bands aligned at every width */
.ac-hd{display:flex;align-items:center;gap:18px;padding:18px 24px;background:var(--card-hd);border-bottom:1px solid var(--stroke-weak);
  border-radius:var(--r-card) var(--r-card) 0 0;min-height:96px}
.ac-logo{width:44px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ac-logo svg{width:100%;height:100%}
.ac-name{font-size:21px;font-weight:700;line-height:1.2}
.ac-go{margin-left:auto;color:var(--accent);opacity:0;transition:opacity .15s;flex-shrink:0}
.appcard:hover .ac-go{opacity:1}
.ac-mid{display:flex;padding:16px 24px;border-bottom:1px solid var(--stroke-weak)}
.ac-metric{flex:1;min-width:0;padding-right:16px}
.ac-metric+.ac-metric{border-left:1px solid var(--stroke-weak);padding-left:24px;padding-right:0}
.ac-metric .v{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ac-metric .v svg{flex-shrink:0}
.ac-metric .l{font-size:11.5px;color:var(--text-weak);margin-top:4px;display:flex;align-items:center;gap:5px}
.ac-metric.comp .v{color:var(--success);font-size:17px;gap:7px}
.ac-ft{display:flex;gap:26px;padding:18px 24px 22px;flex:1}
.ac-obj{flex:1;min-width:0}
.ac-obj .rl{font-size:13.5px;font-weight:600;color:var(--text-mod);margin-bottom:7px}
.ac-obj .rv{display:flex;align-items:baseline;gap:8px}
.ac-obj .rv b{font-size:23px;font-weight:700;line-height:1}
.ac-obj .rv .st{font-size:13px;color:var(--text-mod)}
.ac-obj .rv .tot{margin-left:auto;font-size:13px;color:var(--text-mod)}
.bar{height:4px;border-radius:3px;background:rgba(160,199,255,.20);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#21ddaa,#34d399);border-radius:3px;transition:width .4s}
.bar i.none{background:rgba(198,203,203,.35)}

/* info tooltip */
.i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--text-dis);
  color:var(--text-dis);font-size:9px;font-style:italic;font-weight:700;cursor:help;position:relative;flex-shrink:0}
.i:hover{border-color:var(--text);color:var(--text)}
.i .tip{display:none;position:absolute;bottom:calc(100% + 9px);left:-10px;width:250px;background:var(--modal-grad);
  border:1px solid var(--border-mod);border-radius:var(--r-tip);box-shadow:var(--e4);padding:11px 13px;font-size:12px;font-style:normal;
  font-weight:400;line-height:1.55;color:var(--text-mod);z-index:50;text-align:left}
.i:hover .tip{display:block}

/* ---------- org page: fit to the viewport ----------
   No page-level scroll: the whole org page lives inside 100vh. Backup Jobs and
   Status take the height left over from the card row, and the Status card
   scrolls inside itself rather than growing the page. */
.railcard{padding:0}
body.fit{height:100vh;overflow:hidden;padding-bottom:0}
body.fit .wrap{height:calc(100vh - 60px);display:flex;flex-direction:column;min-height:0;padding-bottom:22px}
body.fit #app{flex:1;min-height:0;display:flex;flex-direction:column}
body.fit .orggrid{flex:1;min-height:0;grid-template-rows:auto minmax(0,1fr)}
body.fit .jobs,body.fit .railcard{height:100%;min-height:0}
.jobs{display:flex;flex-direction:column}
.railcard{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(160,199,255,.3) transparent}
.railcard::-webkit-scrollbar{width:9px}
.railcard::-webkit-scrollbar-track{background:transparent}
.railcard::-webkit-scrollbar-thumb{background:rgba(160,199,255,.28);border-radius:5px;border:2px solid transparent;background-clip:content-box}
.railcard::-webkit-scrollbar-thumb:hover{background:rgba(160,199,255,.45);background-clip:content-box}
.rsec{padding:22px 24px;border-top:1px solid var(--stroke-weak)}
.rsec:first-child{border-top:none}
.rsec h3{margin-bottom:18px}
.rsec .rhd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.rsec .rhd h3{margin:0}
.connrow{display:flex;align-items:center;gap:22px}
.cfield .cl{font-size:12px;color:var(--text-weak)}
.cfield .cv{font-size:13.5px;font-weight:600;margin-top:3px}
.rtext{font-size:13px;color:var(--text-mod);line-height:1.6}
.snapblock{display:flex;gap:18px;align-items:center;margin-top:4px}
.rtable{width:100%;border-collapse:collapse;margin-top:14px}
.rtable th{text-align:left;font-size:11.5px;font-weight:700;color:var(--text-mod);padding:0 10px 10px 0;
  border-bottom:1px solid var(--table-bd);white-space:nowrap}
.rtable td{padding:13px 10px 13px 0;font-size:12.5px;border-bottom:1px solid var(--stroke-weak);vertical-align:middle}
.rtable tr:last-child td{border-bottom:none}
.rtable td:first-child{font-weight:600}
.rtable .tr{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lic{display:flex;gap:40px;margin-top:6px}
.lic .lv{font-size:22px;font-weight:700;margin-top:5px}
.lic .lv small{font-size:12px;color:var(--text-weak);font-weight:600}
.lic .ll{font-size:12px;color:var(--text-weak)}

/* ---------- backup jobs chart ---------- */
.jobs{padding:22px 24px 24px}
.jobshd{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sel{position:relative}
.sel select{appearance:none;height:34px;background:rgba(47,202,255,.06);border:1px solid var(--stroke);border-radius:var(--r-btn);
  color:var(--text);font-family:var(--font);font-size:12.5px;padding:0 30px 0 12px;cursor:pointer;outline:none}
.sel select:focus{border-color:var(--accent)}
.sel::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-weak);pointer-events:none;font-size:10px}
.chartgrid{display:grid;grid-template-columns:minmax(0,1fr) 226px;gap:26px;align-items:center;flex:1;min-height:0}
.chartbox{position:relative;height:100%;min-height:140px}
.chartbox svg{width:100%;height:100%;overflow:visible;display:block}
.legend .lrow{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:14px}
.legend .lrow b{font-weight:700}
.legend .lrow .m{width:22px;height:2px;position:relative;flex-shrink:0}
.legend .lrow .m::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;
  border-radius:50%;border:2px solid;background:#0a2c56}
.legend .note{font-size:12px;color:var(--text-weak);line-height:1.6;margin-top:18px}

/* ---------- app page: main tabs ---------- */
.tabsmain{display:flex;gap:34px;border-bottom:1px solid var(--stroke);font-size:12.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:26px}
.tabsmain .t{display:flex;align-items:center;gap:9px;padding:12px 2px;color:var(--text-mod);cursor:pointer}
.tabsmain .t:hover{color:var(--text)}
.tabsmain .t.active{color:var(--text);box-shadow:inset 0 -3px 0 var(--accent)}
.tabsmain .t svg{width:16px;height:16px}

/* restore landing cards */
.restorecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.rcard{display:flex;flex-direction:column;transition:border-color .15s,transform .15s,box-shadow .15s}
.rcard:hover{border-color:rgba(77,210,210,.5);transform:translateY(-2px);box-shadow:var(--e4)}
.rc-hd{padding:22px 26px;background:var(--card-hd);border-bottom:1px solid var(--stroke-weak);border-radius:var(--r-card) var(--r-card) 0 0}
.rc-hd h3{font-size:21px;font-weight:700}
.rc-body{padding:26px;flex:1;display:flex;flex-direction:column;min-height:210px}
.rc-body .d{font-size:13.5px;color:var(--text-mod);line-height:1.65}
.rc-btn{margin-top:auto;height:44px;width:100%;border-radius:var(--r-btn);border:1px solid rgba(160,199,255,.18);
  background:rgba(47,202,255,.07);color:var(--accent);font-family:var(--font);font-size:12.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer}
.rc-btn:hover{background:rgba(77,210,210,.16);border-color:rgba(77,210,210,.45)}

/* manage protection: pill sub-tabs */
.pilltabs{display:flex;gap:6px;margin-bottom:20px}
.pill{padding:9px 18px;border-radius:6px 6px 0 0;font-size:13.5px;color:var(--text-mod);cursor:pointer;border:1px solid transparent;
  border-bottom:none}
.pill:hover{color:var(--text);background:rgba(47,202,255,.05)}
.pill.active{color:var(--text);font-weight:600;background:rgba(47,202,255,.10);border-color:var(--stroke-weak)}
.mpbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mpbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.mpgrid{display:grid;grid-template-columns:214px minmax(0,1fr);gap:32px;align-items:start}

/* filter rail */
.frail{padding-top:2px}
.frgroup{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--stroke-weak)}
.frgroup:last-child{border-bottom:none}
.frhd{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px}
.frhd .cr{font-size:10px;color:var(--text-weak);transition:transform .18s}
.frgroup.collapsed .frbody{display:none}
.frgroup.collapsed .frhd .cr{transform:rotate(180deg)}
.fropt{display:flex;align-items:center;gap:11px;padding:6px 0;font-size:13px;color:var(--text-mod);cursor:pointer}
.fropt:hover{color:var(--text)}
.fropt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frclear{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 0;display:inline-block}
.frclear:hover{color:#7ce7e7}

/* controls */
.cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--stroke);border-radius:4px;background:transparent;
  cursor:pointer;position:relative;flex-shrink:0;vertical-align:middle}
.cb:checked{background:var(--accent-solid);border-color:var(--accent-solid)}
.cb:checked::after{content:"✓";position:absolute;color:#fff;font-size:11px;line-height:13px;left:2px;top:0}
.rd{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--stroke);border-radius:50%;background:transparent;
  cursor:pointer;position:relative;flex-shrink:0;vertical-align:middle}
.rd:checked{border-color:var(--accent)}
.rd:checked::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.search{position:relative}
.search input{width:300px;height:38px;background:rgba(47,202,255,.06);border:1px solid var(--stroke);border-radius:var(--r-btn);
  color:var(--text);font-family:var(--font);font-size:13px;padding:0 14px 0 38px;outline:none}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--text-dis)}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-weak);display:flex}
.search.sm input{height:34px;width:250px;font-size:12.5px}

/* flat data table (manage protection / wizard lists) */
table.flat{width:100%;border-collapse:collapse}
table.flat th{text-align:left;font-size:12.5px;color:var(--text-mod);font-weight:700;padding:0 14px 12px;border-bottom:1px solid var(--table-bd);
  white-space:nowrap;user-select:none}
table.flat th.s{cursor:pointer}
table.flat th.s:hover{color:var(--text)}
table.flat th .ar{font-size:9px;margin-left:5px;opacity:.85}
table.flat td{padding:0 14px;height:56px;border-bottom:1px solid var(--stroke-weak);vertical-align:middle;font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.flat tbody tr{cursor:pointer}
table.flat tbody tr:hover{background:var(--row-hover)}
/* row-selected class is deliberately NOT ".sel" — that is the dropdown wrapper,
   whose ::after would paint a stray caret inside selected rows */
table.flat tbody tr.rowsel{background:rgba(77,210,210,.10);box-shadow:inset 3px 0 0 var(--accent)}
table.flat .cbcell{width:44px;padding-right:0!important}
table.flat td.tac,table.flat th.tac{text-align:right}
table.flat .kebab{color:var(--text-weak);cursor:pointer;font-size:16px;letter-spacing:1px;opacity:0}
table.flat tr:hover .kebab,table.flat tr.rowsel .kebab{opacity:1}
table.flat .kebab:hover{color:var(--text)}
.colcfg{color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:flex-end}
.colcfg:hover{color:#7ce7e7}
.oname{display:flex;align-items:center;gap:11px;min-width:0}
.oname svg{width:17px;height:17px;flex-shrink:0;color:var(--text-mod)}
.oname .nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 14px;text-align:center;color:var(--text-weak);font-size:13.5px}
.tabnote{font-size:12.5px;color:var(--text-weak);padding:14px 14px 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:var(--r-chip);font-size:11.5px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip.ok{color:var(--success);background:var(--success-bg);border-color:var(--success-bd)} .chip.ok .d{background:var(--success)}
.chip.warn{color:var(--warning);background:var(--warning-bg);border-color:var(--warning-bd)} .chip.warn .d{background:var(--warning)}
.chip.val{color:var(--neutral);background:var(--neutral-bg);border-color:rgba(198,203,203,.38)} .chip.val .d{background:var(--neutral)}
.chip.info{color:var(--info);background:rgba(47,202,255,.14);border-color:rgba(47,202,255,.42)} .chip.info .d{background:var(--info)}

/* ---------- menus ---------- */
.menu{position:absolute;min-width:230px;background:var(--modal-grad);border:1px solid var(--border-mod);border-radius:var(--r-tip);
  box-shadow:var(--e4);padding:7px 0;z-index:70;display:none}
.menu.open{display:block}
.menu .mh{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-weak);font-weight:700;padding:8px 15px 6px}
.menu .mi{display:flex;align-items:center;gap:11px;padding:10px 15px;font-size:13px;color:var(--text-mod);cursor:pointer}
.menu .mi:hover{background:rgba(47,202,255,.10);color:var(--text)}
.menu .mi.dis{opacity:.4;cursor:not-allowed}
.menu .mi.dis:hover{background:none;color:var(--text-mod)}
.menu .sepline{height:1px;background:var(--stroke-weak);margin:6px 0}

/* ---------- modal / wizard ---------- */
.modalbg{position:fixed;inset:0;background:rgba(3,10,22,.62);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center}
.modalbg.open{display:flex}
.modal{width:1020px;max-width:94vw;max-height:90vh;background:linear-gradient(180deg,#0b3a63,#0a2b4f);border:1px solid var(--border-mod);
  border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--e6)}
.modal.sm{width:760px}
/* group wizard: fixed footprint — the dialog never resizes between steps or
   within a step; overflowing content scrolls inside .mbody */
.modal.gw{width:1180px;height:min(780px,88vh)}
.mhd{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--stroke-weak);background:rgba(255,255,255,.03)}
.mhd h2{font-size:20px;font-weight:400}
.mhd .mact{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--text-weak)}
.mhd .mact span{cursor:pointer;display:flex}
.mhd .mact span:hover{color:var(--text)}
.stepper{display:flex;align-items:center;justify-content:center;gap:0;padding:16px 0 6px}
.st{display:flex;align-items:center}
.st .c{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(160,199,255,.35);color:var(--text-dis);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;background:transparent}
.st.cur .c{border-color:var(--accent);color:var(--accent)}
.st.done .c{background:var(--accent);border-color:var(--accent);color:#04222a}
.st .ln{width:34px;height:1.5px;background:rgba(160,199,255,.35)}
.st.done .ln{background:var(--accent)}
.mbody{padding:14px 34px 30px;overflow-y:auto;flex:1;min-height:0}
.mbody h3{font-size:25px;font-weight:800;margin-bottom:16px}
.mbody .lead{font-size:13.5px;color:var(--text-mod);line-height:1.7;margin-bottom:26px;max-width:760px}
.mfooter{display:flex;align-items:center;gap:14px;padding:16px 28px;border-top:1px solid var(--stroke-weak);background:rgba(255,255,255,.03)}
.mfooter .mfl{font-size:12.5px;color:var(--text-weak);display:flex;align-items:center;gap:10px}
.mfooter .mfr{margin-left:auto;display:flex;gap:12px}
.ack{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-mod);cursor:pointer}

/* wizard: what-to-expect */
.expect{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:30px;align-items:start}
.exitem{margin-bottom:26px}
.exitem h4{font-size:15.5px;font-weight:700;margin-bottom:8px}
.exitem p{font-size:13.5px;color:var(--text-mod);line-height:1.7}
.exnote{font-size:13.5px;color:var(--text-mod);line-height:1.7}
.illus{width:100%;height:auto}

/* wizard: list step */
.wsplit{display:grid;grid-template-columns:210px minmax(0,1fr);gap:30px;align-items:start}
/* the search sits flush with the right edge of the table below it */
.wtop{display:flex;align-items:center;gap:24px;margin-bottom:22px}
.wtop .lead{margin:0;flex:1;max-width:none}
.wtop .search{margin-left:auto;flex-shrink:0}
.wlist{max-height:400px;overflow-y:auto;border-bottom:1px solid var(--stroke-weak)}
/* step 2 fills the fixed dialog height so the list uses all available space */
.mbody.fill{display:flex;flex-direction:column}
.mbody.fill .wsplit{flex:1;min-height:0}
.mbody.fill .wsplit>div:last-child{height:100%;display:flex;flex-direction:column;min-height:0}
.mbody.fill .wlist{flex:1;min-height:0;max-height:none}
table.flat td.snapcell{width:1%;white-space:nowrap;text-align:right;padding-right:8px}
.wlist table.flat td{height:52px}
.wlist table.flat thead th{position:sticky;top:0;background:#0c3159;z-index:2}
.selcount{font-size:12.5px;color:var(--text-weak)}

/* wizard: option rows */
.optrow{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border:1px solid var(--stroke-mod);border-radius:var(--r-card);
  margin-bottom:12px;cursor:pointer;background:rgba(47,202,255,.03)}
.optrow:hover{border-color:rgba(77,210,210,.4);background:rgba(47,202,255,.06)}
.optrow.on{border-color:rgba(77,210,210,.55);background:rgba(77,210,210,.08)}
.optrow.off{opacity:.5;cursor:not-allowed}
.optrow .ot{font-size:14px;font-weight:600}
.optrow .od{font-size:12.5px;color:var(--text-weak);margin-top:4px;line-height:1.6}
.optsub{margin:-4px 0 16px 46px;max-width:460px}
.optsub label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mod);margin-bottom:8px}
.optsub select,.optsub input{width:100%;height:40px;background:rgba(47,202,255,.06);border:1px solid var(--stroke);border-radius:var(--r-btn);
  color:var(--text);font-family:var(--font);font-size:13.5px;padding:0 12px;outline:none}
.optsub select:focus,.optsub input:focus{border-color:var(--accent)}
.slabottom{border-top:1px solid var(--stroke-weak);margin-top:20px;padding-top:16px}
.slabottom .optrow{border:none;background:none;padding:9px 0;margin:0}
.slabottom .optrow:hover{background:none}
.slabottom .optrow .ot{font-weight:700;display:inline}
.slabottom .optrow .od{display:inline;margin-left:7px;color:var(--text-mod)}
.slabottom .optrow svg{width:16px;height:16px;color:var(--text-weak);flex-shrink:0;margin-top:1px}
.confirm .cline{font-size:14px;color:var(--text-mod);margin-bottom:14px}
.confirm .cline b{color:var(--text)}
.confirm .crule{border-top:1px solid var(--stroke-weak);margin:26px 0 22px}
.confirm h4{font-size:19px;font-weight:800;margin-bottom:20px}
.confirm .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:620px}
.confirm .ck{font-size:13px;color:var(--text-weak);margin-bottom:10px}
.confirm .cv{font-size:14px}
.objtype{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-mod)}
.objtype b{color:var(--text);font-weight:600}
.plusbtn{width:38px;height:38px;border-radius:var(--r-btn);background:var(--accent-solid);color:#fff;border:none;cursor:pointer;
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.plusbtn:hover{background:var(--accent-hover)}

/* toasts */
#toasts{position:fixed;bottom:24px;right:24px;z-index:95;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;align-items:flex-start;gap:12px;min-width:310px;max-width:430px;background:var(--modal-grad);
  border:1px solid var(--border-mod);border-left:3px solid var(--success);border-radius:var(--r-card);box-shadow:var(--e6);padding:14px 16px;
  animation:tin .22s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast .tt{font-size:13px;font-weight:700} .toast .td{font-size:12px;color:var(--text-weak);margin-top:3px;line-height:1.5}
.toast .tc{margin-left:auto;color:var(--text-weak);cursor:pointer;font-size:14px}
.toast.info{border-left-color:var(--info)}

/* ---------- group restore wizard ---------- */
/* step 1: restore scope — cards fill the dialog width so the step reads symmetric */
.scopelist{max-width:none}
.scopecard{display:flex;gap:15px;align-items:flex-start;padding:18px 22px;border:1px solid var(--stroke-mod);border-radius:var(--r-card);
  background:rgba(47,202,255,.03);cursor:pointer;margin-bottom:14px;transition:border-color .14s,background .14s}
.scopecard:hover{border-color:rgba(77,210,210,.45);background:rgba(47,202,255,.06)}
.scopecard.on{border-color:rgba(77,210,210,.62);background:linear-gradient(90deg,rgba(33,221,170,.17),rgba(47,202,255,.05) 62%)}
.scopecard .sct{font-size:16.5px;font-weight:700}
.scopecard .scd{font-size:13px;color:var(--text-mod);margin-top:7px;line-height:1.65}
.scopecard .rd{margin-top:3px}

/* step 2: snapshot pill on the selected row */
.snappill{display:inline-flex;align-items:center;gap:9px;height:30px;padding:0 12px;border-radius:6px;border:1px solid rgba(77,210,210,.55);
  background:rgba(77,210,210,.12);color:var(--text);font-size:12.5px;white-space:nowrap;cursor:pointer}
.snappill:hover{background:rgba(77,210,210,.2)}
.snappill svg{width:13px;height:13px;color:var(--accent)}
.wlist table.flat td.snapcell{text-align:right;padding-right:8px}

/* change-snapshot side drawer */
.drawerbg{position:fixed;inset:0;background:rgba(3,10,22,.5);backdrop-filter:blur(2px);z-index:88;display:none}
.drawerbg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1080px,78vw);background:linear-gradient(180deg,#0b3a63,#0a2b4f);
  border-left:1px solid var(--border-mod);box-shadow:-18px 0 44px rgba(0,0,0,.38);z-index:89;display:none;flex-direction:column}
.drawer.open{display:flex;animation:dslide .22s ease-out}
@keyframes dslide{from{transform:translateX(48px);opacity:.55}to{transform:none;opacity:1}}
.snapgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.snaphd{font-size:12.5px;font-weight:700;color:var(--text-mod);padding:0 14px 12px;border-bottom:1px solid var(--table-bd)}
.snaprow{display:flex;align-items:center;gap:13px;padding:0 14px;height:52px;border-bottom:1px solid var(--stroke-weak);cursor:pointer;
  font-size:13.5px}
.snaprow:hover{background:var(--row-hover)}
.snaprow.on{background:rgba(77,210,210,.10);box-shadow:inset 3px 0 0 var(--accent)}
.snaprow svg.cam{width:16px;height:16px;color:var(--text-mod);flex-shrink:0}
.snapscroll{max-height:calc(100vh - 330px);overflow-y:auto}
.customdates{display:flex;gap:10px;margin-top:10px}
.customdates input{flex:1;height:34px;background:rgba(47,202,255,.06);border:1px solid var(--stroke);border-radius:var(--r-btn);
  color:var(--text);font-family:var(--font);font-size:12.5px;padding:0 10px;outline:none}

/* step 3: restore location */
.locopt{display:flex;gap:14px;align-items:flex-start;padding:4px 0 18px;cursor:pointer}
.locopt .lt{font-size:15px;font-weight:700}
.locopt .ld{font-size:13px;color:var(--text-mod);margin-top:5px;line-height:1.6;max-width:640px}
.locopt .rd{margin-top:2px}
.locsub{margin:16px 0 0 0;padding-left:2px}

.subopt{display:flex;gap:13px;align-items:flex-start;padding:8px 0;cursor:pointer}
.subopt .st2{font-size:14px;font-weight:700}
.subopt .sd2{font-size:12.5px;color:var(--text-weak);margin-top:4px;line-height:1.55}

.locfield input,.locfield select{width:330px;height:38px;background:rgba(47,202,255,.06);border:1px solid var(--stroke);
  border-radius:var(--r-btn);color:var(--text);font-family:var(--font);font-size:13.5px;padding:0 12px;outline:none}
.locfield input:focus,.locfield select:focus{border-color:var(--accent)}
.locrule{border-top:1px solid var(--stroke-weak);margin:8px 0 20px}
.mfnote{display:flex;align-items:flex-start;gap:13px;font-size:12.5px;color:var(--text-mod);line-height:1.6;max-width:62%}
.mfnote .bi{color:var(--info);flex-shrink:0;margin-top:1px}
.mfooter.hasnote{border-top:1px solid var(--accent)}

/* step 3: nested (member) groups */
.nestbox{border:1px solid var(--stroke-mod);border-radius:var(--r-card);background:rgba(47,202,255,.04);padding:18px 20px;margin:4px 0 22px}
.nesthd{font-size:15px;font-weight:700;margin-bottom:7px}
.nestsub{font-size:13px;color:var(--text-mod);line-height:1.6;margin-bottom:12px;max-width:760px}
.nestbox .subopt{padding:7px 0}
.nestlist{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 10px 29px}
.nestrow{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 12px;border:1px solid var(--stroke-mod);border-radius:20px;
  background:rgba(47,202,255,.05);font-size:12.5px;cursor:pointer}
.nestrow:hover{border-color:rgba(77,210,210,.45)}
.nestrow svg{width:15px;height:15px;color:var(--text-mod)}

/* step 4: confirmation summary */
.sumrow{display:flex;gap:24px;margin-bottom:20px}
.sumrow .sk{width:230px;flex-shrink:0;font-size:14px;color:var(--text-mod)}
.sumrow .sv{font-size:14px;font-weight:700}
.sumrow .sv .sub{font-weight:400;color:var(--text-mod);margin-top:6px;font-size:13.5px}

/* Narrow viewports stack the grid; a page that can no longer fit 100vh scrolls
   normally rather than clipping its content. */
@media (max-width:1180px){
  .restorecards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .expect{grid-template-columns:minmax(0,1fr)}
  .orggrid{grid-template-columns:minmax(0,1fr)}
  .orggrid .jobs{grid-column:span 1}
  body.fit,body.fit .wrap{height:auto;overflow:visible}
  body.fit .orggrid{grid-template-rows:none}
  body.fit .jobs,body.fit .railcard{height:auto}
  .chartbox{min-height:240px}
  .railcard{max-height:620px}
}

/* deterministic snapshot list, newest first: "18 August 2026 at 14:06" */
function snapList(o){
  if(!o.protected || !o.snaps) return [];
  const seed = o.natId.charCodeAt(2) + o.name.length;
  return Array.from({length:10},(_,i)=>{
    const d = new Date(NOW.getTime() - i*864e5);
    const hh = 12 + ((seed+i)%3), mm = (seed*7 + i*13) % 60;
    return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} at ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  });
}

  if(p[0]==='app' && APPS[p[1]]) go('app', {app:p[1], tab:p[2]==='protect'?'protect':'restore', sub:p[3]});
  else go('org');
}
window.addEventListener('hashchange', ()=>{ if(location.hash !== hashFor()) applyHash(); });

function drawChart(){
  const svg=document.getElementById('chart'), box=document.getElementById('chartbox'); if(!svg||!box) return;
  // draw in real pixels so labels never stretch when the card flexes to fill height
  const W=Math.max(420, box.clientWidth||900), H=Math.max(200, box.clientHeight||262);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const days=parseInt(S.range,10), L=56,R=10,T=14,B=32;
  const x=i=>L+(W-L-R)*(i/(days-1)), y=v=>T+(H-T-B)*(1-v/100);
  const succ=[]; for(let i=0;i<days;i++){
    let s=100;
    if(days>7){ const dip=Math.floor(days*0.42), drop=Math.floor(days*0.66);
      if(i===dip) s=97.2; if(i>=drop) s=98.4; }
    succ.push(s);
  }
  const fail=succ.map(v=>100-v);
  const pts=a=>a.map((v,i)=>x(i)+','+y(v)).join(' ');
  const step=days<=7?1:Math.ceil(days/7), labels=[];
  for(let i=0;i<days;i+=step) labels.push([i,fmtD(new Date(NOW.getTime()-(days-1-i)*864e5))]);
  if(labels[labels.length-1][0]!==days-1) labels.push([days-1,fmtD(NOW)]);
  svg.innerHTML = `
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21ddaa" stop-opacity=".40"/><stop offset="1" stop-color="#21ddaa" stop-opacity="0"/></linearGradient></defs>
    ${[0,20,40,60,80,100].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="rgba(160,199,255,.16)"
        stroke-width="1" ${v===0?'':'stroke-dasharray="3 4"'}/>
      <text x="${L-12}" y="${y(v)+4}" fill="#c6cbcb" font-size="11" text-anchor="end" font-family="Open Sans">${v?v+'%':'0'}</text>`).join('')}
    <text x="18" y="${H/2}" fill="#c6cbcb" font-size="11" font-family="Open Sans" transform="rotate(-90 18 ${H/2})" text-anchor="middle">Users</text>
    <polygon fill="url(#ga)" points="${L},${y(0)} ${pts(succ)} ${W-R},${y(0)}"/>
    <polyline fill="none" stroke="#21ddaa" stroke-width="2.4" points="${pts(succ)}"/>
    <polyline fill="none" stroke="#ff5664" stroke-width="2.4" points="${pts(fail)}"/>
    ${labels.map(([i,t])=>`<text x="${x(i)}" y="${H-8}" fill="#c6cbcb" font-size="11" font-family="Open Sans" text-anchor="middle">${t}</text>`).join('')}`;
  const avg = succ.reduce((a,b)=>a+b,0)/succ.length;
  document.getElementById('legend').innerHTML =
    `<div class="lrow"><span class="m" style="background:#ff5664;color:#ff5664"></span><b>${pct(+(100-avg).toFixed(1))}</b> Failed</div>
     <div class="lrow"><span class="m" style="background:#21ddaa;color:#21ddaa"></span><b>${pct(+avg.toFixed(1))}</b> Succeeded</div>
     <div class="note">The above values represent the percentage of failed and successful backup jobs for the selected time period.</div>`;
}

function slaRail(){
  const opt = (v,label) => `<label class="fropt"><input type="checkbox" class="cb" data-act="slaf" data-v="${v}"
     ${S.slaFilter.has(v)?'checked':''}><span>${label}</span></label>`;
  return `<div class="frgroup">
    <div class="frhd" data-act="fr-toggle">SLA Domain <span class="cr">▲</span></div>
    <div class="frbody">
      ${opt("__none","Don't Protect")}${opt("__nosla","No SLA Domain")}
      <span class="frclear" data-act="clear-slaf">Clear</span>
      ${SLA_DOMAINS.map(s=>opt(s.name, s.name.length>22 ? s.name.slice(0,20)+'…' : s.name)).join('')}
    </div></div>`;
}

function filterRows(list){
  const q = S.q.trim().toLowerCase();
  let rows = list.filter(o=>{
    if(q && !(o.name.toLowerCase().includes(q) || (o.email||'').toLowerCase().includes(q))) return false;
    if(S.slaFilter.size){
      const key = o.sla ? o.sla : (o.assignment==='Direct' ? '__none' : '__nosla');
      if(!S.slaFilter.has(key)) return false;
    }
    return true;
  });
  if(S.sort.col){
    const k = S.sort.col;
    rows = rows.slice().sort((m,n)=>{
      const A = k==='size'?m.size:(k==='sla'?(m.sla||''):(m[k]||'')), B = k==='size'?n.size:(k==='sla'?(n.sla||''):(n[k]||''));
      return (A>B?1:A<B?-1:0)*S.sort.dir;
    });
  }
  return rows;
}

function th(label,col,cls=''){
  const on = S.sort.col===col;
  return `<th class="s ${cls}" data-act="sort" data-col="${col}">${label}${on?`<span class="ar">${S.sort.dir>0?'▲':'▼'}</span>`:''}</th>`;
}

function protectTable(rows){
  const kind = S.sub;
  const idLabel = {ou:'Organizational Unit ID', user:'User ID', shared:'Shared Drive ID', group:'Group ID'}[kind];
  const extra = {ou:'<th class="tac">Users</th>', user:'<th>Status</th>'+th('Organizational Unit','ou'),
                 shared:'', group:'<th class="tac">Members</th>'}[kind];
  const head = `<tr><th class="cbcell"><input type="checkbox" class="cb" data-act="sel-all"
      ${rows.length && rows.every(o=>S.sel.has(o.id))?'checked':''}></th>
    ${th(KIND[kind],'name')}${kind==='ou'?'':th('Email ID','email')}${extra}${th('SLA Domain','sla')}
    <th>Assignment</th><th>${idLabel}</th><th class="tac" style="width:52px">
      <span class="colcfg" data-act="toast" data-title="Table settings" data-msg="Choose which columns to display.">${ICON.cols}</span></th></tr>`;
  if(!rows.length) return `<table class="flat"><thead>${head}</thead></table>
    <div class="empty">No ${KINDS[kind]} match the current filters.</div>`;
  const body = rows.map(o=>{
    // lazy per-kind cells: an object literal would evaluate every branch
    let cells = '';
    if(kind==='ou')         cells = `<td class="tac">${o.users}</td>`;
    else if(kind==='user')  cells = `<td>${o.status}</td><td>${o.ou}</td>`;
    else if(kind==='group') cells = `<td class="tac">${num(o.members)}</td>`;
    return `<tr class="${S.sel.has(o.id)?'rowsel':''}" data-act="row" data-id="${o.id}">
      <td class="cbcell"><input type="checkbox" class="cb" data-act="sel" data-id="${o.id}" ${S.sel.has(o.id)?'checked':''}></td>
      <td><div class="oname">${ICON[kind==='ou'?'ou':kind==='user'?'user':kind==='shared'?'shared':'group']}
        <span class="nn">${o.name}</span></div></td>
      ${kind==='ou'?'':`<td class="muted" title="${o.email}">${o.email}</td>`}
      ${cells}
      <td>${SLA_LABEL(o)}</td>
      <td>${o.assignment==='Unassigned'?'<span class="muted">—</span>':o.assignment}</td>
      <td class="muted" title="${o.natId}" style="max-width:190px;font-family:'Fira Code',monospace;font-size:12px">${o.natId}</td>
      <td class="tac"><span class="kebab" data-act="row-menu" data-id="${o.id}">···</span></td></tr>`;
  }).join('');
  return `<table class="flat"><thead>${head}</thead><tbody>${body}</tbody></table>
    <div class="tabnote">${rows.length} of ${listFor(S.app,kind).length} ${KINDS[kind]}</div>`;
}

function rwPaint(html,wide){
  openModal(html,!wide);
  md.querySelectorAll('[data-rw]').forEach(el=>{
    const a = el.dataset.rw;
    if(a==='q'){ el.addEventListener('input',()=>{ RW.q=el.value; rwRender(); }); return; }
    if(a==='folder'){ el.addEventListener('input',()=>{ RW.folder=el.value; }); return; }
    if(a==='rp'){ el.addEventListener('change',()=>{ RW.rp[el.dataset.id]=el.value; }); return; }
    if(a==='loctarget'){ el.addEventListener('change',()=>{ RW.locTarget=el.value; }); return; }
    el.addEventListener('click', e=>{
      switch(a){
        case 'skip': RW.skipIntro=el.checked; return;
        case 'next': RW.step++; if(RW.step===3&&!RW.locTarget) RW.locTarget=rwPool()[0]&&rwPool()[0].id; break;
        case 'back': RW.step--; break;
        case 'togglerp': RW.changeRp=!RW.changeRp; break;
        case 'ouf': el.checked?RW.ouF.add(el.dataset.v):RW.ouF.delete(el.dataset.v); RW.sel=new Set(); break;
        case 'status': RW.status=el.dataset.v; RW.sel=new Set(); break;
        case 'scope': RW.scope=el.dataset.v; RW.sel=new Set(); break;
        case 'sel': e.stopPropagation(); RW.sel.has(el.dataset.id)?RW.sel.delete(el.dataset.id):RW.sel.add(el.dataset.id); break;
        case 'row': {
          if(e.target.closest('select')||e.target.closest('[data-rw="sel"]')) return;
          const id=el.dataset.id; RW.sel.has(id)?RW.sel.delete(id):RW.sel.add(id); break;
        }
        case 'selall': {
          const rows=rwRows(); const all=rows.every(o=>RW.sel.has(o.id));
          rows.forEach(o=> all?RW.sel.delete(o.id):RW.sel.add(o.id)); break;
        }
        case 'loc': RW.loc=el.dataset.v; break;
        case 'opt': RW.opt=el.dataset.v; break;
        case 'finish': {
          const n=(RW.kind==='scale'&&RW.scope==='all')?rwPool().length:RW.sel.size;
          const where = RW.loc==='orig' ? 'the original location'
            : (byId(RW.locTarget)||{name:'the selected target'}).name;
          closeModal();
          toast('Restore started',
            `${num(n)} ${KINDS[RW.kind==='scale'?'user':RW.kind]} queued for restore to ${where}. Track progress under Events → Recovery.`,'info');
          return;
        }
      }
      rwRender();
    });
  });
}

  {v:'membership', t:'Membership list',

  {v:'settings', t:'Group settings',
   d:'Restore group settings only — posting permissions, conversation history access and external membership permissions — without touching the membership.'},
  {v:'metadata', t:'Group metadata',

];

const pad2 = n => String(n).padStart(2,'0');
const h12  = d => `${d.getHours()%12||12}:${pad2(d.getMinutes())} ${d.getHours()<12?'AM':'PM'}`;
const fmtPill = d => `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} at ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const fmtSnap = d => `${MONS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, ${h12(d)}`;
/* deterministic snapshot history for an object, newest first */
function snapsOf(o){
  const seed = o.name.length*7 + o.email.charCodeAt(0);
  return Array.from({length:40},(_,i)=>{
    const d = new Date(NOW.getTime() - i*864e5);
    d.setHours(12 + ((seed+i)%3), (seed*7 + i*13)%60, 0, 0);
    return d;
  });
}

    <div class="sumrow"><div class="sk">Recovery Scope</div><div class="sv">${SCOPE_T(GW.scope)}</div></div>
    <div class="sumrow"><div class="sk">Group</div><div class="sv">${g.name}<div class="sub">${g.email}</div></div></div>
    <div class="sumrow"><div class="sk">Snapshot</div><div class="sv">${fmtSnap(d)}</div></div>
    <div class="sumrow"><div class="sk">Restore Location</div>
      <div class="sv">${locLine}${locSub?`<div class="sub">${locSub}</div>`:''}</div></div>
    ${nestRow}</div>`;
  const footer = `<div class="mfooter"><div class="mfl"></div><div class="mfr">
    <button class="btn" data-gw="back">Back</button>
    <button class="btn primary" data-gw="finish">Restore</button></div></div>`;
  gwPaint(mhd('Restore a Group',false)+stepper(4,T)+body+footer);
}

/* nested groups: only meaningful when membership is part of the restore */
const nestedOf = g => (NESTED[g.name]||[]);
function nestedBlock(g){
  const kids = nestedOf(g);
  if(!kids.length || !(GW.scope==='full' || GW.scope==='membership')) return '';
  return `<div class="nestbox">
    <div class="nesthd">Nested Group Memberships</div>
    <div class="nestsub"><b>${g.name}</b> contains ${kids.length} ${kids.length===1?'group':'groups'} as members in this
      snapshot. Choose whether those memberships are restored along with the individual members.</div>
    <label class="subopt" data-gw="nest" data-v="restore">
      <input type="radio" class="rd" name="gwnest" ${GW.nest==='restore'?'checked':''}>
      <div><div class="st2">Restore nested group memberships</div>
        <div class="sd2">Member groups are re-added exactly as they appear in the snapshot.</div></div></label>
    ${GW.nest==='restore'?`<div class="nestlist">${kids.map(k=>`
      <label class="nestrow"><input type="checkbox" class="cb" data-gw="nestskip" data-v="${k}"
        ${GW.nestSkip.has(k)?'':'checked'}>${ICON.group}<span>${k}</span></label>`).join('')}</div>`:''}
    <label class="subopt" data-gw="nest" data-v="skip">
      <input type="radio" class="rd" name="gwnest" ${GW.nest==='skip'?'checked':''}>
      <div><div class="st2">Skip nested group memberships</div>
        <div class="sd2">Only individual members are restored. Member groups are left as they are today.</div></div></label>
  </div>`;
}

function gwPaint(html){
  openModal(html);
  md.className='modal gw';
  md.querySelectorAll('[data-gw]').forEach(el=>{
    const a = el.dataset.gw;
    if(a==='q'){ el.addEventListener('input',()=>{ GW.q=el.value; gwRender(); }); return; }
    if(a==='newname'){ el.addEventListener('input',()=>{ GW.newName=el.value; }); return; }
    if(a==='newemail'){ el.addEventListener('input',()=>{ GW.newEmail=el.value; }); return; }
    if(a==='target'){ el.addEventListener('change',()=>{ GW.targetId=el.value||null; gwRender(); }); return; }
    el.addEventListener('click', e=>{
      switch(a){
        case 'scope': GW.scope=el.dataset.v; break;
        case 'typef': el.checked?GW.typeF.add(el.dataset.v):GW.typeF.delete(el.dataset.v); break;
        case 'status': GW.status=el.dataset.v; break;
        case 'pickgroup': {
          if(e.target.closest('[data-gw="chgsnap"]')) return;
          if(GW.gid!==el.dataset.id){ GW.gid=el.dataset.id; GW.snap=0; GW.targetId=null; }
          break;
        }
        case 'chgsnap': e.stopPropagation(); GW.tmpSnap=GW.snap; snapPicker(); return;
        case 'loc': if(e.target.closest('.locsub')) return;   // nested controls handle themselves
                    GW.loc=el.dataset.v; break;
        case 'origmode': GW.origMode=el.dataset.v; break;
        case 'diffmode': GW.diffMode=el.dataset.v; break;
        case 'nest': GW.nest=el.dataset.v; break;
        case 'nestskip': el.checked?GW.nestSkip.delete(el.dataset.v):GW.nestSkip.add(el.dataset.v); return;
        case 'noroles': GW.noRoles=el.checked; return;   // no re-render: keeps focus
        case 'back': GW.step--; break;
        case 'cancel': closeModal(); return;
        case 'next': GW.step++; break;
        case 'finish': {
          const g=gwGroup(), d=snapsOf(g)[GW.snap];
          const where = GW.loc==='orig' ? 'the original group'
            : GW.diffMode==='existing' ? (byId(GW.targetId)||{name:'the selected group'}).name
            : (GW.newName||g.name+' (restored)');
          closeModal();
          toast('Restore started',
            `${SCOPE_T(GW.scope)} of ${g.name} from ${fmtSnap(d)} is being restored to ${where}. Track progress under Events → Recovery.`,'info');
          return;
        }
      }
      gwRender();
    });
  });
}

/* change-snapshot panel (right-side drawer, over the wizard) */
function snapPicker(){
  const g = gwGroup();
  const paint = () => {
    const all = snapsOf(g);
    let list;
    if(GW.range==='custom'){
      const f=new Date(GW.from+'T00:00:00'), t=new Date(GW.to+'T23:59:59');
      list = all.map((d,i)=>[d,i]).filter(([d])=>d>=f && d<=t);
    } else {
      const days=parseInt(GW.range,10);
      list = all.map((d,i)=>[d,i]).filter(([d])=>(NOW-d) <= days*864e5);
    }
    openDrawer(`${mhd('Change Snapshot for '+g.name,false)}
      <div class="mbody">
        <div class="lead" style="margin-bottom:26px">Select the snapshot you want to use to restore data from the group ${g.name}.</div>
        <div class="snapgrid">
          <div class="frail"><div class="frgroup">
            <div class="frhd" data-act="fr-toggle">Time Range <span class="cr">▲</span></div>
            <div class="frbody">${RANGES.map(([v,l])=>`<label class="fropt"><input type="radio" class="rd" name="gwrange"
              data-sp="range" data-v="${v}" ${GW.range===v?'checked':''}><span>${l}</span></label>`).join('')}
              ${GW.range==='custom'?`<div class="customdates">
                <input type="date" data-sp="from" value="${GW.from}"><input type="date" data-sp="to" value="${GW.to}"></div>`:''}
            </div></div></div>
          <div>
            <div class="snaphd">Snapshot Date and Time</div>
            <div class="snapscroll">${list.map(([d,i])=>`
              <div class="snaprow ${GW.tmpSnap===i?'on':''}" data-sp="pick" data-i="${i}">
                <input type="radio" class="rd" name="gwsnap" ${GW.tmpSnap===i?'checked':''}>
                <svg class="cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M3 7.8h3.6l1.5-2.4h7.8l1.5 2.4H21v11H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
                <span>${fmtSnap(d)}</span></div>`).join('')}
              ${list.length?'':'<div class="empty">No snapshots in this time range.</div>'}</div>
          </div></div></div>
      <div class="mfooter"><div class="mfl"></div><div class="mfr">
        <button class="btn" data-sp="cancel">Cancel</button>
        <button class="btn primary" data-sp="save">Save</button></div></div>`);
    dr.querySelectorAll('[data-sp]').forEach(el=>{
      const a=el.dataset.sp;
      if(a==='from'||a==='to'){ el.addEventListener('change',()=>{ GW[a]=el.value; paint(); }); return; }
      el.addEventListener('click',()=>{
        if(a==='range'){ GW.range=el.dataset.v; paint(); }
        else if(a==='pick'){ GW.tmpSnap=+el.dataset.i; paint(); }
        else if(a==='cancel'){ closeDrawer(); }
        else if(a==='save'){ GW.snap=GW.tmpSnap; closeDrawer(); gwRender(); }
      });
    });
  };
  paint();
}

/* ===========================================================================
   Manage Protection wizard
   =========================================================================== */
const MP = {on:false};
function openProtect(ids){
  const objs = ids.map(byId).filter(Boolean);
  Object.assign(MP, {on:true, ids, objs, step:1, choice:objs[0]&&objs[0].sla||null, mode:'sla', q:''});
  mpRender();
}
function mpTarget(){
  return MP.objs.length===1 ? MP.objs[0].name : `${num(MP.objs.length)} selected objects`;
}
function mpRender(){
  if(MP.step===1){
    const q=MP.q.trim().toLowerCase();
    const rows=WS_SLA.filter(s=>!q||s.name.toLowerCase().includes(q));
    const body = `<div class="mbody"><h3>Assign an SLA Domain</h3>
      <div class="lead" style="margin-bottom:20px">Assign an SLA Domain to <b>${mpTarget()}</b>.</div>
      <div class="wtop" style="align-items:center;margin-bottom:18px">
        <div class="objtype" style="flex:1">Object Type: <b>Google Workspace</b> <span style="font-size:10px;color:var(--text-weak)">▾</span></div>
        <button class="plusbtn" data-mp="new-sla" title="Create SLA Domain">＋</button>
        <div class="search sm"><span class="si">${ICON.searchi}</span>
          <input placeholder="Search by SLA Domain" value="${MP.q}" data-mp="q"></div></div>
      <table class="flat"><thead><tr><th class="cbcell"></th><th>SLA Domain</th><th>Deployment Model</th>
        <th>Creator Org</th><th>Base Frequency</th><th>Maximum Rete…</th></tr></thead>
        <tbody>${rows.map(s=>`<tr class="${MP.mode==='sla'&&MP.choice===s.name?'rowsel':''}" data-mp="pick" data-v="${s.name}">
          <td class="cbcell"><input type="radio" class="rd" name="mpsla" ${MP.mode==='sla'&&MP.choice===s.name?'checked':''}></td>
          <td><div class="oname">${ICON.shield}<span class="nn">${s.name}</span></div></td>
          <td>${s.model}</td><td title="${s.org}" style="max-width:150px">${s.org}</td><td>${s.freq}</td><td>${s.ret}</td></tr>`).join('')}
        </tbody></table>
      ${rows.length?'':'<div class="empty">No SLA Domains match the search.</div>'}
      <div class="slabottom">
        <div class="optrow ${MP.mode==='none'?'on':''}" data-mp="mode" data-v="none">
          <input type="radio" class="rd" name="mpsla" ${MP.mode==='none'?'checked':''}>${ICON.noprot}
          <div><span class="ot">Don't Protect.</span><span class="od">Selected object won't be protected until you directly change their SLA Domain assignment.</span></div></div>
        <div class="optrow ${MP.mode==='clear'?'on':''}" data-mp="mode" data-v="clear">
          <input type="radio" class="rd" name="mpsla" ${MP.mode==='clear'?'checked':''}>${ICON.clearsla}
          <div><span class="ot">Clear current SLA Domain.</span><span class="od">Selected object will inherit the SLA Domain of the parent object, if applicable.</span></div></div>
      </div></div>`;
    const ready = MP.mode!=='sla' || !!MP.choice;
    const footer = `<div class="mfooter"><div class="mfl"></div><div class="mfr">
      <button class="btn primary" data-mp="next" ${ready?'':'disabled'}>Next</button></div></div>`;
    return mpPaint(mhd('Manage Protection',true)+stepper(1,2)+body+footer);
  }
  const s = MP.mode==='sla' ? slaOf(MP.choice) : null;
  const headline = MP.mode==='sla' ? MP.choice : MP.mode==='none' ? "Don't Protect" : 'Clear current SLA Domain';
  const body = `<div class="mbody confirm"><h3>Confirmation</h3>
    <div class="cline"><b>SLA Domain:</b> ${headline}</div>
    <div class="cline">${MP.mode==='sla'?'The SLA Domain will be applied to':MP.mode==='none'
      ?'Protection will be removed from':'The SLA Domain assignment will be cleared for'} <b>${mpTarget()}</b></div>
    ${MP.mode==='sla'?`<div class="crule"></div><h4>Frequency and Retention</h4>
      <div class="cgrid"><div><div class="ck">Take every</div><div class="cv">${s.freq}</div></div>
        <div><div class="ck">Retain for</div><div class="cv">${s.retLabel}</div></div></div>`
      :`<div class="crule"></div><div class="lead">${MP.mode==='none'
        ? 'Existing snapshots are retained and remain available for restore. No new snapshots will be taken.'
        : 'The object inherits the SLA Domain of its parent, if one is assigned.'}</div>`}</div>`;
  const footer = `<div class="mfooter"><div class="mfl"></div><div class="mfr">
    <button class="btn" data-mp="back">Back</button><button class="btn primary" data-mp="assign">Assign</button></div></div>`;
  mpPaint(mhd('Manage Protection',false)+stepper(2,2)+body+footer);
}
function mpPaint(html){
  openModal(html);
  md.querySelectorAll('[data-mp]').forEach(el=>{
    const a=el.dataset.mp;
    if(a==='q'){ el.addEventListener('input',()=>{ MP.q=el.value; mpRender(); }); return; }
    el.addEventListener('click',()=>{
      switch(a){
        case 'pick': MP.mode='sla'; MP.choice=el.dataset.v; break;
        case 'mode': MP.mode=el.dataset.v; break;
        case 'next': MP.step=2; break;
        case 'back': MP.step=1; break;
        case 'new-sla': toast('Create SLA Domain','Opening the SLA Domain creation wizard for object type Google Workspace.','info'); return;
        case 'assign': {
          const parentSla = APPS[S.app].sla;
          MP.objs.forEach(o=>{
            if(MP.mode==='sla'){ o.sla=MP.choice; o.assignment='Direct'; o.protected=true; if(!o.snaps) o.snaps=1; }
            else if(MP.mode==='none'){ o.sla=null; o.assignment='Direct'; o.protected=false; }
            else { o.sla=parentSla; o.assignment='Derived'; o.protected=true; if(!o.snaps) o.snaps=1; }
          });
          const n=MP.objs.length;
          closeModal(); S.sel=new Set();
          toast('Protection updated', MP.mode==='sla'
            ? `${num(n)} object${n>1?'s':''} assigned to SLA Domain ${MP.choice}.`
            : MP.mode==='none' ? `${num(n)} object${n>1?'s':''} set to Don't Protect. Existing snapshots are retained.`
            : `SLA Domain cleared on ${num(n)} object${n>1?'s':''}. They now inherit ${parentSla}.`);
          render(); return;
        }
      }
      mpRender();
    });
  });
}

/* ===========================================================================
   Delegated events (page level)
   =========================================================================== */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ closeMenu(); return; }
  const act=el.dataset.act, keepMenu=['menu-kebab','menu-protect-org','row-menu'].includes(act);
  switch(act){
    case 'apps': toast('Apps','Returning to the Apps inventory for all SaaS applications.','info'); break;
    case 'org': go('org'); break;
    case 'open-app': go('app',{app:el.dataset.app,tab:'restore'}); break;
    case 'tab': go('app',{app:S.app,tab:el.dataset.tab}); break;
    case 'sub': go('app',{app:S.app,tab:'protect',sub:el.dataset.sub}); break;
    // groups use their own 4-step wizard; Drive/Gmail keep the generic one
    case 'restore': el.dataset.kind==='group' ? openGroupRestore() : openRestore(el.dataset.kind); break;

    case 'sort': { const c=el.dataset.col; S.sort={col:c,dir:S.sort.col===c?-S.sort.dir:1}; render(); break; }
    case 'sel': { e.stopPropagation(); const id=el.dataset.id; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break; }
    case 'row': {
      if(e.target.closest('[data-act="sel"]')||e.target.closest('[data-act="row-menu"]')) return;
      const id=el.dataset.id; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break;
    }
    case 'sel-all': {
      e.stopPropagation();
      const rows=filterRows(listFor(S.app,S.sub)); const all=rows.every(o=>S.sel.has(o.id));
      rows.forEach(o=> all?S.sel.delete(o.id):S.sel.add(o.id)); render(); break;
    }
    case 'clear-sel': S.sel=new Set(); render(); break;
    case 'slaf': { const v=el.dataset.v; S.slaFilter.has(v)?S.slaFilter.delete(v):S.slaFilter.add(v); render(); break; }
    case 'clear-slaf': S.slaFilter=new Set(); render(); break;
    case 'fr-toggle': el.closest('.frgroup').classList.toggle('collapsed'); break;

    case 'mp-open': if(S.sel.size) openProtect([...S.sel]); break;
    case 'row-menu': {
      const o=byId(el.dataset.id);
      openMenu(el, `<div class="mh">${o.name}</div>
        <div class="mi" data-act="mp-one" data-id="${o.id}">Manage Protection</div>
        <div class="mi" data-act="snap-one" data-id="${o.id}">Take On-Demand Snapshot</div>
        <div class="sepline"></div>
        <div class="mi" data-act="toast" data-title="Object ID copied" data-msg="${o.natId}">Copy ${KIND[o.kind]} ID</div>`);
      break;
    }
    case 'mp-one': closeMenu(); openProtect([el.dataset.id]); break;
    case 'snap-one': { closeMenu(); const o=byId(el.dataset.id);
      toast('Snapshot started',`On-demand backup queued for ${o.name}.`,'info'); break; }

    case 'menu-kebab':
      openMenu(el, `<div class="mi" data-act="toast" data-title="Edit organization" data-msg="Opening organization settings for ${ORG}.">Edit Organization</div>
        <div class="mi" data-act="toast" data-title="Refresh" data-msg="Refreshing the Google Workspace hierarchy for ${DOMAIN}.">Refresh Hierarchy</div>
        <div class="mi" data-act="toast" data-title="Storage regions" data-msg="Google Workspace backups are stored in GCP region ${REGION}.">Storage Regions</div>
        <div class="sepline"></div><div class="mi dis">Remove Organization</div>`);
      break;
    case 'menu-protect-org':
      openMenu(el, `<div class="mh">All Workspace apps</div>
        ${Object.keys(APPS).map(k=>FLOWS[k].protect
          ? `<div class="mi" data-act="goto-protect" data-app="${k}">${APPS[k].name.split(',')[0]}</div>`
          : `<div class="mi" data-act="toast" data-title="Manage Protection"
               data-msg="SLA Domain assignment for ${APPS[k].name} is not part of this prototype round.">${APPS[k].name.split(',')[0]}</div>`
        ).join('')}`);
      break;
    case 'goto-protect': closeMenu(); go('app',{app:el.dataset.app,tab:'protect'}); break;
    case 'snap-org': openModal(`${mhd('Take On-Demand Snapshot',false)}
      <div class="mbody"><h3 style="font-size:21px">Snapshot all Workspace apps</h3>
        <div class="lead">An on-demand snapshot of every protected object in <b>${ORG}</b> will be taken immediately, using the
          retention of each object's SLA Domain.</div>
        <div class="optrow on" style="cursor:default"><input type="radio" class="rd" checked disabled>
          <div><div class="ot">${num(Object.keys(APPS).reduce((s,k)=>s+APPS[k].cardRows.flatMap(([kk])=>cardList(k,kk)).filter(o=>o.protected).length,0))} protected objects</div>
          <div class="od">Google Drive, Gmail Calendar and Contacts, and Workspace Settings.</div></div></div></div>
      <div class="mfooter"><div class="mfl">Storage: GCP region ${REGION}</div><div class="mfr">
        <button class="btn" data-act="close-modal">Cancel</button>
        <button class="btn primary" data-act="snap-go">Take Snapshot</button></div></div>`, true);
      break;
    case 'snap-go': closeModal(); toast('Snapshot started','On-demand backup queued for all protected Google Workspace objects.','info'); break;
    case 'close-modal': closeModal(); break;
    case 'toast': closeMenu(); toast(el.dataset.title, el.dataset.msg, 'info'); break;
  }
  if(!el.closest('#menu') && !keepMenu) closeMenu();
});

document.addEventListener('input', e=>{
  const el=e.target.closest('[data-act="q"]'); if(!el) return;
  S.q=el.value;
  const host=document.querySelector('.mpgrid > div:last-child');
  if(host){ host.innerHTML=protectTable(filterRows(listFor(S.app,S.sub))); }
});
document.addEventListener('change', e=>{
  const el=e.target.closest('[data-act="range"]'); if(!el) return;
  S.range=el.value; drawChart();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  closeMenu();
  drawerOpen() ? closeDrawer() : closeModal();   // Esc closes the top layer first
});
let rsz;
window.addEventListener('resize', ()=>{
  closeMenu();
  clearTimeout(rsz);
  rsz = setTimeout(()=>{ if(S.view==='org') drawChart(); }, 120);
});

function info(text){ return `<span class="i">i<span class="tip">${text}</span></span>`; }

applyHash();
</script>
